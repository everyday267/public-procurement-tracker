# PRD v1.4 §2 기준 16개 기관 (2024년 조달청 시설공사 발주계획 분석자료 순).
# source_type: A = 나라장터(G2B) 경유 수집, C = 자체 조달시스템(어댑터/스크래핑)
agencies:
