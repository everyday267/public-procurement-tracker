  - agency_code: G2B
    agency_name: 대한민국 정부조달청 (나라장터)
    source_type: A
    self_system_url: https://apis.data.go.kr/1230000/ao/PubDataOpnStdService
    phase: 1

  - agency_code: KR_RAIL
    agency_name: 국가철도공단
    source_type: C
    self_system_url: https://ebid.kr.or.kr
    phase: 1

  - agency_code: KEPCO
    agency_name: 한국전력공사
    source_type: C
    # 1차 수집 경로는 공공데이터포털 OpenAPI(openapi.kepco.co.kr), srm은 폴백 (실행계획 §2.1)
    self_system_url: https://srm.kepco.net
    phase: 1

  - agency_code: LH
    agency_name: 한국토지주택공사
    source_type: C
    self_system_url: https://ebid.lh.or.kr
    phase: 1

