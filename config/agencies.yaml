    source_type: C
    phase: 2

  - agency_code: KHNP
    agency_name: 한국수력원자력
    source_type: C
    phase: 2

  - agency_code: EWP
    agency_name: 한국동서발전
    source_type: C
    phase: 2

  - agency_code: KOMIPO
    agency_name: 한국중부발전
    source_type: C
    phase: 2

  - agency_code: KOSPO
