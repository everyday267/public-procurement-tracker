name: monthly-collect

on:
  schedule:
    # 매월 1일 07:00 KST = 전날 22:00 UTC. 28~31일 매일 트리거되므로
    # "날짜 가드" 스텝에서 내일이 1일인 경우에만 실제 수집을 실행한다.
    - cron: '0 22 28-31 * *'
  workflow_dispatch:
    inputs:
      month:
        description: '수집 월 (YYYY-MM). 비우면 전월 자동 계산'
        required: false
      since:
        description: '임의 시작일 (YYYY-MM-DD). 짧은 스모크 테스트용. until과 함께 지정하면 month보다 우선'
        required: false
      until:
        description: '임의 종료일 (YYYY-MM-DD)'
        required: false
      sources:
        description: '수집 소스 (쉼표구분, 예: g2b_opnstd 또는 lh,kr_rail). 비우면 전체'
        required: false
      probe_script:
        description: '설정 시 수집 대신 조사 스크립트 실행 (scripts/ 하위 파일명, 예: probe_phase2.py)'
        required: false

jobs:
  # Phase 2 조사 모드 (실행계획 §3.1): 개발 컨테이너의 네트워크 차단을 우회해
  # 러너에서 OpenAPI 존재 여부·사이트 접근성을 조사하고 샘플을 아티팩트로 회수.
  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.probe_script != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Playwright 준비 (XHR 캡처 스크립트용)
        if: contains(github.event.inputs.probe_script, 'xhr')
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 조사 실행
        run: python scripts/${{ github.event.inputs.probe_script }}
        env:
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
          DATA_EX_API_KEY: ${{ secrets.DATA_EX_API_KEY }}
          KISCON_API_KEY: ${{ secrets.KISCON_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      - name: 샘플 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output-${{ github.run_number }}
          path: probe_output/
          retention-days: 30

  collect:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.probe_script == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 날짜 가드 (스케줄 실행은 매월 1일 0시 UTC 부근에서만 진행)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$(date -u -d 'tomorrow' +'%d')" = "01" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: 수집 인자 계산
        id: args
        if: steps.guard.outputs.should_run == 'true'
        run: |
          SINCE="${{ github.event.inputs.since }}"
          UNTIL="${{ github.event.inputs.until }}"
          SOURCES="${{ github.event.inputs.sources }}"
          if [ -n "$SINCE" ] && [ -n "$UNTIL" ]; then
            # 임의 구간 (짧은 테스트). 라벨은 파일명·아티팩트명에 사용.
            echo "cli=--since $SINCE --until $UNTIL" >> $GITHUB_OUTPUT
            echo "label=${SINCE//-/}_${UNTIL//-/}" >> $GITHUB_OUTPUT
          else
            if [ -n "${{ github.event.inputs.month }}" ]; then
              MONTH="${{ github.event.inputs.month }}"
            else
              MONTH="$(date -u -d '1 month ago' +'%Y-%m')"
            fi
            echo "cli=--month $MONTH" >> $GITHUB_OUTPUT
            echo "label=${MONTH//-/}" >> $GITHUB_OUTPUT
          fi
          if [ -n "$SOURCES" ]; then
            echo "sources=--sources $SOURCES" >> $GITHUB_OUTPUT
          else
            echo "sources=" >> $GITHUB_OUTPUT
          fi

      - name: 수집 실행
        if: steps.guard.outputs.should_run == 'true'
        run: python -m src.run_monthly ${{ steps.args.outputs.cli }} ${{ steps.args.outputs.sources }}
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          EX_API_KEY: ${{ secrets.EX_API_KEY }}

      - name: KISCON 대조 검증 (검증 층 2)
        if: steps.guard.outputs.should_run == 'true'
        # 검증 실패(플래그 발생·API 장애)가 수집 산출물 업로드를 막지 않도록 한다.
        # 플래그는 kiscon_recon 테이블에 남아 schema-monitor 워크플로우가 이슈화한다.
        continue-on-error: true
        run: python -m src.validate_kiscon --db procurement.db ${{ steps.args.outputs.cli }}
        env:
          KISCON_API_KEY: ${{ secrets.KISCON_API_KEY }}
          KISCON_RECORDS_OP: ${{ vars.KISCON_RECORDS_OP }}

      - name: KOSIS 건설업 통계 수집 (검증 보조)
        if: steps.guard.outputs.should_run == 'true'
        # 종합·전문·전기 공사규모별 발주기관별 계약실적. 수집·요약 실패가
        # 산출물 업로드를 막지 않도록 한다.
        #
        # ⚠️ kosis.kr은 해외(미국 GitHub 러너) IP의 443 연결을 차단한다
        #    (probe 확인: ConnectTimeout). 한국 소재 HTTPS 프록시를
        #    KOSIS_HTTPS_PROXY 시크릿으로 등록하면 requests가 자동으로 그걸
        #    통해 호출한다. 미등록 시 이 스텝은 타임아웃으로 스킵된다.
        continue-on-error: true
        run: python -m src.kosis --db procurement.db
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          HTTPS_PROXY: ${{ secrets.KOSIS_HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.KOSIS_HTTPS_PROXY }}

      - name: KOSIS 연간 대조 (상한 sanity check)
        if: steps.guard.outputs.should_run == 'true'
        # KOSIS 수집이 비어있으면(해외 러너 차단) NO_KOSIS로 로그만 남고 넘어간다.
        continue-on-error: true
        run: python -m src.validate_kosis --db procurement.db

      - name: 수집 결과 요약 (표본 대조용)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          # 통합 조인 CSV와 계약 CSV는 전문 출력한다 — 개발 컨테이너에서
          # 아티팩트를 내려받을 수 없어 로그가 유일한 데이터 회수 경로다.
          for f in output/all_joined_*.csv output/*_contracts_*.csv output/kiscon_recon_*.csv output/kiscon_recon_*.md output/kosis_recon_*.csv output/kosis_recon_*.md; do
            [ -f "$f" ] || continue
            echo "===== $f ($(($(wc -l < "$f") - 1))행) ====="
            cat "$f"
          done
          for f in output/*_joined_*.csv; do
            case "$f" in output/all_joined_*) continue ;; esac
            [ -f "$f" ] || continue
            echo "===== $f ($(($(wc -l < "$f") - 1))행) ====="
          done

      - name: DB 업로드 (아티팩트)
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: procurement-db-${{ steps.args.outputs.label }}
          path: procurement.db
          retention-days: 90
