name: monthly-collect

on:
  schedule:
    # 매월 1일 07:00 KST = 전날 22:00 UTC. 28~31일 매일 트리거되므로
    # "날짜 가드" 스텝에서 내일이 1일인 경우에만 실제 수집을 실행한다.
    - cron: '0 22 28-31 * *'
  workflow_dispatch:
    inputs:
      month:
        description: '수집 월 (YYYY-MM). 비우면 전월 자동 계산'
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 날짜 가드 (스케줄 실행은 매월 1일 0시 UTC 부근에서만 진행)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$(date -u -d 'tomorrow' +'%d')" = "01" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: 수집 월 계산
        id: month
        if: steps.guard.outputs.should_run == 'true'
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "value=${{ github.event.inputs.month }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(date -u -d '1 month ago' +'%Y-%m')" >> $GITHUB_OUTPUT
          fi

      - name: 월간 수집 실행
        if: steps.guard.outputs.should_run == 'true'
        run: python -m src.run_monthly --month ${{ steps.month.outputs.value }}
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          LH_API_KEY: ${{ secrets.LH_API_KEY }}

      - name: DB 업로드 (아티팩트)
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: procurement-db-${{ steps.month.outputs.value }}
          path: procurement.db
          retention-days: 90
