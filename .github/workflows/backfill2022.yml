name: backfill-2022-sep-dec

# 임시 백필 워크플로우: GitHub MCP 토큰 만료로 workflow_dispatch를 호출할 수
# 없는 상황의 우회로. 이 파일을 브랜치에 push하면 즉시 4개월 매트릭스가 실행된다.
# 2022년 연간 수집(9~12월분)이 끝나면 삭제한다.
on:
  push:
    branches: [claude/kepco-adapter-impl-fu6odp]
    paths: ['.github/workflows/backfill2022.yml']

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        month: ['2022-09', '2022-10', '2022-11', '2022-12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        run: python -m src.run_monthly --month ${{ matrix.month }} --sources g2b_opnstd,kr_rail,lh,kwater,ex,kogas
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          EX_API_KEY: ${{ secrets.EX_API_KEY }}

      - name: 수집 결과 요약 (CSV 전문 출력)
        run: |
          for f in output/all_joined_*.csv output/*_contracts_*.csv; do
            [ -f "$f" ] || continue
            echo "===== $f ($(($(wc -l < "$f") - 1))행) ====="
            cat "$f"
          done
