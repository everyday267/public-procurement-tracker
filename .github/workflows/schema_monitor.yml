name: schema-monitor

on:
  workflow_run:
    workflows: ["monthly-collect"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: monthly-collect 결과 DB 아티팩트 다운로드
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: procurement-db-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      # monthly.yml은 28~31일 매일 트리거되지만 날짜 가드 때문에 실제로는
      # 매월 1일에만 아티팩트를 생성한다. 그 외 날짜는 다운로드가 실패하므로
      # (아티팩트 없음) 조용히 건너뛴다.
      - name: 어댑터 장애 / 스키마 변경 감지
        if: steps.download.outcome == 'success'
        run: python -m src.schema_monitor --db procurement.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
